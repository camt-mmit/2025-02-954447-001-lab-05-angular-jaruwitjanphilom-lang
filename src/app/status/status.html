<div class="container">
<h1>Status</h1>
<table>
<tr>
  <td>Current Time</td>
  <td>{{ currentDate }}</td>
</tr>
<tr>
  <td>User Agent</td>
  <td>{{ userAgent }}</td>
</tr>
<tr>
  <td>Languages</td>
  <td>{{ languages }}</td>
</tr>
<tr>
  <td>Is Cookie Enabled?</td>
  <td>{{ cookieEnabled }}</td>
</tr>
<tr>
  <td>Logical Processors</td>
  <td>{{ logicalProcessors }}</td>
</tr>
<tr>
  <td>Max Touch Points</td>
  <td>{{ maxTouchPoints }}</td>
</tr>
</table>
</div>
